[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxrebalance"
version = "0.1.0"
description = "Tax-aware portfolio rebalancing with Canadian ACB and U.S. tax-lot models"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Garros Gong"}]
keywords = ["portfolio", "optimization", "tax", "rebalancing", "risk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26,<3", "cvxpy>=1.6.5,<2", "osqp>=1.0.4,<1.1"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.scripts]
taxrebalance = "taxrebalance.cli:main"

[project.urls]
Homepage = "https://github.com/garroshub/taxrebalance"
Repository = "https://github.com/garroshub/taxrebalance"
Demo = "https://garroshub.github.io/taxrebalance/"

[tool.setuptools.packages.find]
include = ["taxrebalance*", "tax_rebalancing*"]
exclude = ["legacy_sector_strategy*", "tests*", "tools*"]
