<title id="title">From account history to risk-constrained trades</title>
<desc id="desc">Canadian average cost basis or United States tax lots are joined with current prices and target allocations. CVXPY tests trade directions under tracking error and cash constraints and returns trades plus estimated tax, fees, and risk penalties.</desc>
