<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
<title id="title">TaxRebalance: Tax-aware portfolio rebalancing in Python</title>
<desc id="description">A Python optimization toolkit. A synthetic Canadian example compares a risk-only modeled objective of minus 482.99 Canadian dollars to a tax-aware modeled objective of minus 969.88 Canadian dollars, a 486.89 dollar reduction in the model objective, not investment returns.</desc>
<rect width="1200" height="420" rx="14" fill="#0b111c"/>
<g font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(56 48)">
<rect width="46" height="46" rx="10" fill="#17473f" stroke="#348c7a"/>
<text x="14" y="32" font-size="29" font-weight="750" fill="#91ebcf">T</text>
<path d="M31 15L38 8M33 8H38V13" fill="none" stroke="#91ebcf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="61" y="28" font-size="18" fill="#7ccab3" font-weight="650" letter-spacing="1.8">QUANTITATIVE PORTFOLIO TOOLS</text>
</g>
<text x="54" y="191" font-size="77" font-weight="750" letter-spacing="-3.2" fill="#f0f6fc">Tax<tspan fill="#74d8bc">Rebalance</tspan></text>
<text x="57" y="249" font-size="29" fill="#d8e4f0">Trades, tax costs, and tracking error.</text>
<text x="57" y="289" font-size="23" fill="#93a9bb">One optimizer. Two tax-basis models.</text>
<path d="M57 332H678" stroke="#314355" stroke-width="1.3"/>
<text x="57" y="373" font-size="19" fill="#a4b4c6" font-family="Consolas,Menlo,monospace">PYTHON 3.10+  /  CVXPY  /  CANADA + U.S.</text>
<rect x="735" y="35" width="423" height="350" rx="12" fill="#132133" stroke="#30455a" stroke-width="1.5"/>
<text x="761" y="75" font-size="17" font-weight="700" letter-spacing="1" fill="#80d9bf">SYNTHETIC CANADA CASE</text>
<text x="1128" y="75" font-size="16" text-anchor="end" fill="#95a9b9">4 ETFs</text>
<path d="M761 94H1132" stroke="#355062"/>
<text x="762" y="139" font-size="19" fill="#bbcbd8">Risk-only</text>
<text x="1130" y="139" text-anchor="end" font-size="25" font-weight="600" fill="#eaf2f9">−C$482.99</text>
<text x="762" y="177" font-size="16" fill="#7f98ad">Modeled objective</text>
<path d="M761 193H1132" stroke="#304659"/>
<text x="762" y="237" font-size="19" fill="#bbcbd8">Tax-aware</text>
<text x="1130" y="237" text-anchor="end" font-size="25" font-weight="650" fill="#83e2c4">−C$969.88</text>
<text x="762" y="271" font-size="16" fill="#7f98ad">Same risk limit and target</text>
<rect x="761" y="285" width="371" height="69" rx="7" fill="#1b403c"/>
<path d="M779 317L787 325L805 306" fill="none" stroke="#82e1c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="816" y="318" font-size="24" font-weight="650" fill="#e7fff5">C$486.89</text>
<text x="816" y="341" font-size="16" fill="#b2d9cd">lower modeled cost, not a refund</text>
</g>
</svg>
